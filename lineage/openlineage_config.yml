# OpenLineage client configuration — Day 9
#
# Used by the OpenLineage Python client when OPENLINEAGE_URL is set.
# Points to a Marquez backend (local Docker or hosted).
#
# To start Marquez locally:
#   docker compose up marquez marquez-web
#
# Lineage API:  http://localhost:5000
# Lineage UI:   http://localhost:3000
#
# Set in .env:
#   OPENLINEAGE_URL=http://localhost:5000
#   OPENLINEAGE_NAMESPACE=rag-pipeline

transport:
  type: http
  url: ${OPENLINEAGE_URL}
  auth:
    type: api_key
    apiKey: ${OPENLINEAGE_API_KEY}

# Namespace groups all jobs for this pipeline in the lineage graph.
namespace: rag-pipeline

# Job name conventions:
#   spark.bronze_write       — Kafka → Bronze Delta
#   spark.silver_transform   — Bronze → Silver Delta
#   spark.gold_embed         — Silver → Gold Delta + Pinecone upsert

# Full lineage graph:
#   kafka://raw-documents
#     → delta://bronze
#       → delta://silver
#         → delta://gold
#         → pinecone://rag-pipeline
