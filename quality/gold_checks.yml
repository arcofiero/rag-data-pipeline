# Gold Embedding Quality Gate
# Run after the embedding pipeline completes.
# Dataset name: "gold_embeddings"

checks for gold_embeddings:

  - missing_count(chunk_id) = 0:
      name: No null chunk IDs in Gold
      fail: when > 0

  - missing_count(vector_id) = 0:
      name: No null vector IDs in Gold
      fail: when > 0

  - missing_count(document_id) = 0:
      name: No null document IDs in Gold
      fail: when > 0

  - missing_count(embedded_at) = 0:
      name: No null embedded_at timestamps in Gold
      fail: when > 0

  - missing_count(model) = 0:
      name: No null model names in Gold
      fail: when > 0

  - invalid_count(model) = 0:
      name: Embedding model is a known value
      valid values: [text-embedding-3-small, text-embedding-3-large, text-embedding-ada-002]
      fail: when > 0

  - duplicate_count(vector_id) = 0:
      name: No duplicate vector IDs in Gold
      fail: when > 0

  - schema:
      name: Gold schema conformance
      fail:
        when required column missing:
          [chunk_id, vector_id, document_id, source, model,
           embedded_at, embedded_date]
